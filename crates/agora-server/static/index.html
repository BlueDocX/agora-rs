<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
  /* Warm editorial: bone paper, warm ink, butter yellow. */
  :root {
    color-scheme: light;
    --bg: #efebe0; --paper: #fcfaf4; --ink: #17150f; --muted: #857d66; --soft: #b3aa8f; --line: #e4ddca;
    --stone: #f6f2e9; --butter: #f2cc46; --butter-deep: #d9af1b;
    --accent: #4285f4; --ok: #1f9d55; --warn: #d9af1b; --bad: #e5483b; --idle: #b3aa8f; --reviewer: #6366c9;
    --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
  ::selection { background: var(--butter); color: var(--ink); }
  button { font: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(23,21,15,.12); border-radius: 99px; }

  .label { font: 700 10.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mono { font-family: var(--mono); }
  .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 0; padding: 10px 18px;
          font: 800 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .pill.butter { background: var(--butter); color: var(--ink); box-shadow: 0 1px 0 var(--butter-deep); }
  .pill.butter:hover { background: #f7dc6f; }
  .pill.ink { background: var(--ink); color: var(--paper); }
  .pill.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .pill:disabled { opacity: .5; cursor: default; }
  svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Header */
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .logo::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--butter); }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .01em; }
  .ver { font: 500 11px var(--mono); color: var(--muted); }
  header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .key { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; color: var(--muted); }
  .key input { border: 0; background: transparent; font: 500 12px var(--mono); color: var(--ink); width: 150px; padding: 9px 0; outline: none; }

  /* Three panels */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) 340px; gap: 12px; padding: 0 12px 12px; transition: grid-template-columns .25s; }
  /* Receipts need room: the Alibi tab widens the log column. */
  main.wide { grid-template-columns: 420px minmax(0, 1fr) 320px; }
  .panel { background: var(--paper); border: 1px solid rgba(23,21,15,.06); border-radius: 28px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* Logs */
  .logs { padding: 20px 14px 14px; }
  .logs > .label { padding: 0 8px 14px; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--stone); border-radius: 999px; padding: 4px; gap: 2px; }
  .tabs button { border: 0; background: transparent; border-radius: 999px; padding: 9px 0; font: 800 10.5px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--zinc, #55503f); }
  .tabs button.on { background: var(--ink); color: var(--paper); }
  .feed { flex: 1; overflow: auto; margin: 12px 0 0; padding: 0 6px; list-style: none; }
  .feed li { display: flex; gap: 10px; padding: 9px 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .tabs button { position: relative; letter-spacing: .04em !important; font-size: 10px !important; }
  .tabs button.unread::after { content: ""; position: absolute; top: 5px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  /* Chat */
  .feed.chat li { border: 0; padding: 6px 2px; align-items: flex-start; }
  .feed.chat .face { width: 26px; height: 26px; border-radius: 50%; flex: none; margin-top: 2px; position: relative; }
  .feed.chat .face::before, .feed.chat .face::after { content: ""; position: absolute; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: inset 1.5px 0 0 2px var(--ink); }
  .feed.chat .face::before { left: 5px; } .feed.chat .face::after { right: 5px; }
  .feed.chat .bubble { background: var(--stone); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 7px 11px; min-width: 0; }
  .feed.chat .mine .bubble { background: #fbf4d5; border-color: #f2e09b; }
  .feed.chat .notice .bubble { background: transparent; border-style: dashed; color: var(--muted); }
  .feed.chat .bubble b { display: block; font-size: 11.5px; margin-bottom: 2px; }
  .feed.chat .bubble span { white-space: pre-wrap; word-break: break-word; }
  .feed.chat .typing { color: var(--muted); font-style: italic; font-size: 12.5px; padding-left: 36px; }
  .composer { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; font: 600 11.5px var(--sans); color: var(--ink); }
  .chips button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .composer textarea { min-height: 64px; font-style: normal; border-radius: 16px; font-size: 13.5px; }
  .composer .row { margin-top: 0; justify-content: space-between; }
  .feed li .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
  .feed li .t { color: var(--soft); font: 500 11px var(--mono); margin-left: auto; padding-left: 6px; white-space: nowrap; }
  .feed.tech li { font: 11.5px/1.5 var(--mono); color: #55503f; word-break: break-word; }
  .feed .runs-item { cursor: pointer; border-radius: 12px; border-bottom: 0; padding: 10px; }
  .feed .runs-item:hover, .feed .runs-item.on { background: var(--stone); }
  .feed .runs-item .brief { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- Alibi: an errand's ledger and the receipts for what the agent said ---- */
  .feed.alibi li { display: block; border: 0; padding: 5px 2px; }
  .ab-head { background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 12px !important; margin-bottom: 6px; }
  .ab-head b { display: block; font-size: 13px; line-height: 1.35; }
  .ab-head small { font: 500 10.5px/1.5 var(--mono); opacity: .72; }
  .ab-step { display: grid !important; grid-template-columns: 26px 1fr auto; column-gap: 8px; font: 11px/1.45 var(--mono); border-bottom: 1px dashed var(--line) !important; padding: 6px 2px !important; }
  .ab-step .n { color: var(--soft); }
  .ab-step .tool { font-weight: 700; color: var(--ink); }
  .ab-step.fail .tool { color: var(--bad); }
  .ab-step .ok { color: var(--ok); font-weight: 700; } .ab-step.fail .ok { color: var(--bad); }
  .ab-step .res { grid-column: 2 / 4; color: #6b6450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-step .h { grid-column: 2 / 4; color: var(--soft); font-size: 10px; }
  .ab-step.flag { background: #f1ecfb; border-radius: 8px; }
  .ab-q { text-align: right; } .ab-q span { display: inline-block; background: #fbf4d5; border: 1px solid #f2e09b; border-radius: 16px 4px 16px 16px; padding: 6px 11px; font-size: 13px; }
  .ab-said .bubble { background: var(--stone); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 8px 11px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .ab-said .bubble > b { display: block; font-size: 11.5px; margin-bottom: 3px; }
  .ab-said mark { color: inherit; cursor: pointer; border-radius: 3px; padding: 0 1px; }
  mark.v-ok { background: #dff3e6; box-shadow: inset 0 -2px #1f9d55; }
  mark.v-bad { background: #fde2df; box-shadow: inset 0 -2px var(--bad); }
  mark.v-dis { background: #fbf1cf; box-shadow: inset 0 -2px var(--warn); }
  .ab-receipt { font: 11px/1.5 var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 6px; white-space: normal; }
  .ab-receipt b { font-family: var(--sans); }
  .ab-sum { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  .ab-sum span { font: 700 10.5px var(--sans); border-radius: 999px; padding: 3px 9px; }
  .s-ok { background: #dff3e6; color: #17663a; } .s-bad { background: #fde2df; color: #a3261b; }
  .s-hid { background: #ece6f7; color: #4b3a8a; } .s-dis { background: #fbf1cf; color: #7a5d07; }
  .ab-hidden { font: 11px/1.5 var(--mono); color: #4b3a8a; background: #f6f2fd; border-radius: 10px; padding: 7px 10px; margin-top: 4px; }
  .ab-chain { font: 10.5px var(--mono); color: var(--muted); padding: 2px 2px 8px !important; }
  .ab-chain.broken { color: var(--bad); font-weight: 700; }
  .lb { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px !important; background: var(--paper); }
  .lb h4 { margin: 0 0 2px; font-size: 13px; } .lb p { margin: 0 0 8px; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
  .lb-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .lb-row b { font-size: 12px; } .lb-row .num { font: 600 11px var(--mono); text-align: right; }
  .lb-bar { grid-column: 1 / 3; height: 6px; border-radius: 3px; background: #dff3e6; overflow: hidden; }
  .lb-bar i { display: block; height: 100%; background: var(--bad); }
  .ab-step .forget { grid-column: 3; grid-row: 2 / 4; align-self: center; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 8px; font: 700 10px var(--sans); color: #4b3a8a; cursor: pointer; }
  .ab-step .forget:hover { background: #f1ecfb; }
  .ab-step.gone .tool, .ab-step.gone .res { color: var(--soft); text-decoration: line-through; }
  .ab-forgot { font: 11px/1.5 var(--mono); background: #17150f; color: #fcfaf4; border-radius: 12px; padding: 9px 11px; }
  .ab-forgot b { font-family: var(--sans); color: var(--butter); }
  .ab-busy { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .ab-err { color: var(--bad); font-size: 12.5px; }
  .composer[hidden], .pill[hidden] { display: none !important; }
  .empty-note { color: var(--muted); font: 800 10.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 70px 10px; border: 0 !important; display: block !important; }

  /* Office */
  .office { padding: 0; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .team { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border-radius: 16px; padding: 10px 14px; font-weight: 800; }
  .bar .title { line-height: 1.1; }
  .bar .title b { display: block; font-size: 16px; font-weight: 800; }
  .chip { display: flex; align-items: center; gap: 14px; background: var(--stone); border: 1px solid var(--line); border-radius: 16px; padding: 7px 14px; }
  .chip .k { font: 800 9px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chip .v { font: 600 11.5px var(--mono); }
  .chip .sep { width: 1px; align-self: stretch; background: var(--line); }
  .bar .spacer { margin-left: auto; }
  #office3d { position: relative; flex: 1; min-height: 300px; overflow: hidden;
              background: radial-gradient(ellipse 70% 65% at 50% 45%, #fffaf0 0%, #f5eedf 55%, #ece3d1 100%); }
  #office3d canvas { display: block; touch-action: none; cursor: grab; }
  #office3d canvas:active { cursor: grabbing; }
  #office3d .badge { position: absolute; top: 12px; left: 14px; background: var(--paper); border-radius: 10px; padding: 5px 9px; font: 600 11px var(--mono); }
  #office3d .hint { position: absolute; inset: auto 0 18px; text-align: center; color: var(--muted); pointer-events: none; }
  #office3d > button { position: absolute !important; bottom: 12px !important; }
  .handle { height: 4px; width: 48px; border-radius: 99px; background: var(--line); margin: 8px auto 0; }

  /* Kanban */
  .kanban { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 12px; padding: 14px 18px 18px; overflow-x: auto; max-height: 42%; min-height: 140px; }
  .col { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .col h3 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { background: var(--butter); border-radius: 999px; min-width: 20px; padding: 3px 6px; text-align: center; font: 700 10px var(--mono); color: var(--ink); }
  .cards { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .hatch { border-radius: 999px; border: 1px solid var(--line); padding: 15px; text-align: center; color: var(--muted); font: 800 10px var(--sans); letter-spacing: .12em;
           background-image: repeating-linear-gradient(-45deg, rgba(23,21,15,.07) 0 2px, transparent 2px 7px); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .card .who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; line-height: 1.3; }
  .card .who .face { width: 18px; height: 18px; border-radius: 50%; flex: none; position: relative; }
  .card .who .face::before, .card .who .face::after { content: ""; position: absolute; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: inset 1px 0 0 1.5px var(--ink); }
  .card .who .face::before { left: 3px; } .card .who .face::after { right: 3px; }
  .card .state { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .card .unmet { color: #8a6d0b; font-size: 12px; margin: 6px 0 0; padding-left: 16px; }
  .card.failed { border-color: #f3c2bc; } .card.skipped { opacity: .55; }

  /* Project info */
  .info { padding: 24px; overflow-y: auto; }
  .info-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .info-head h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .status { display: inline-flex; align-items: center; gap: 7px; background: var(--stone); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font: 800 9.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .6; }
  .status.live { color: var(--accent); } .status.done { color: var(--ok); } .status.bad { color: var(--bad); }
  .sect { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sect .tag { order: 2; background: #e7f8ef; color: var(--ok); border: 1px solid #bfe9d1; border-radius: 999px; padding: 5px 10px; font: 800 9.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  textarea { width: 100%; min-height: 110px; resize: vertical; font: italic 14px/1.5 var(--sans); color: var(--ink); background: var(--stone);
             border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; outline: none; }
  textarea:focus { border-color: var(--butter-deep); font-style: normal; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 12px; }
  .spend { background: var(--ink); color: var(--paper); border-radius: 22px; padding: 22px; position: relative;
           background-image: radial-gradient(rgba(252,250,244,.14) 1.2px, transparent 1.2px); background-size: 18px 18px; }
  .spend .big { font: 700 38px/1 var(--mono); letter-spacing: -.02em; }
  .spend .sub { margin-top: 16px; font: 500 12px var(--mono); color: #ded7c4; }
  .spend .sub b { color: var(--butter); font-weight: 600; }
  #deliverable { white-space: pre-wrap; margin: 0; font: 13.5px/1.55 var(--sans); background: var(--stone); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; max-height: 420px; overflow: auto; }
  #deliverable.empty { color: var(--muted); font-style: italic; }

  /* Teams */
  .team-pick { display: flex; gap: 8px; align-items: center; }
  select { flex: 1; min-width: 0; font: 600 13px var(--sans); color: var(--ink); background: var(--stone); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; }
  .card .owner { font: 600 11px var(--mono); color: var(--muted); margin-top: 3px; }
  dialog#teams { width: min(1080px, calc(100vw - 24px)); height: min(740px, calc(100vh - 32px)); max-height: none; border: 0; border-radius: 28px;
                 padding: 0; background: var(--paper); color: var(--ink); box-shadow: 0 40px 80px -24px rgba(23,21,15,.4); overflow: hidden; }
  dialog::backdrop { background: rgba(23,21,15,.42); backdrop-filter: blur(6px); }
  .tm { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; }
  .tm-list { background: var(--stone); border-right: 1px solid var(--line); padding: 22px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .tm-list h4 { margin: 0 8px 6px; font-size: 19px; font-weight: 800; }
  .tm-list .label { padding: 14px 10px 6px; }
  .tm-list .item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
                   border-radius: 16px; padding: 9px 10px; color: var(--ink); }
  .tm-list .item:hover { background: rgba(252,250,244,.7); }
  .tm-list .item.on { background: var(--paper); border-color: var(--line); box-shadow: 0 2px 8px -4px rgba(23,21,15,.12); }
  .tm-list .item .t { flex: 1; min-width: 0; }
  .tm-list .item b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-list .item small { display: block; font-size: 11.5px; color: var(--muted); }
  .dots { display: flex; padding-left: 4px; flex: none; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--stone); margin-left: -5px; }
  .tm-list .item.on .dots i { border-color: var(--paper); }
  .tm-list .new { margin-top: 14px; justify-content: center; }
  .tm-main { display: flex; flex-direction: column; min-height: 0; }
  .tm-head { display: flex; align-items: flex-start; gap: 14px; padding: 24px 28px 18px; border-bottom: 1px solid var(--line); }
  .tm-head .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .tm-head .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tm-head .tag2 { font: 800 9.5px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--stone);
                   border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; }
  .tm-head .tag2.mine { color: #8a6d0b; background: #fbf4d5; border-color: #f2e09b; }
  input.inline, textarea.inline { border: 0; background: transparent; outline: none; color: var(--ink); padding: 2px 0; width: 100%; font-family: var(--sans);
                   border-bottom: 2px solid transparent; border-radius: 0; min-height: 0; font-style: normal; resize: none; }
  input.inline:hover, textarea.inline:hover { border-bottom-color: var(--line); }
  input.inline:focus, textarea.inline:focus { border-bottom-color: var(--butter); }
  .tm-head h3, .tm-head input.title { margin: 0; font: 800 26px/1.2 var(--sans); }
  .tm-head input.kind { font: 800 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 200px; }
  .tm-head .desc, .tm-head textarea.desc { font: 14px/1.45 var(--sans); color: #55503f; margin: 0; }
  .close { border: 0; background: var(--stone); border-radius: 50%; width: 38px; height: 38px; font-size: 20px; color: var(--muted); flex: none; }
  .close:hover { background: var(--line); color: var(--ink); }
  .tm-body { flex: 1; overflow-y: auto; padding: 22px 28px 26px; }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .agent { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 16px 16px 16px 20px;
           display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 10px -6px rgba(23,21,15,.12); }
  .agent::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
  .agent .who { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 58px; height: 58px; border-radius: 18px; flex: none; background-color: color-mix(in srgb, var(--c) 16%, #fff);
            background-image: url(/models/cast.png); background-size: 800% 100%; border: 2px solid color-mix(in srgb, var(--c) 40%, #fff); }
  .agent .who .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .agent .nm { font: 700 16px var(--sans); }
  .agent .rl { font: 13px var(--sans); color: #55503f; }
  .agent input.nm:focus { border-bottom-color: var(--c); }
  .agent .x { border: 0; background: var(--stone); width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: 16px; flex: none; align-self: flex-start; }
  .agent .x:hover { background: #fde2df; color: var(--bad); }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .opt > .label { width: 70px; flex: none; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }
  .swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
  .people { display: flex; gap: 3px; flex-wrap: wrap; }
  .people button { width: 27px; height: 27px; border-radius: 8px; border: 1px solid var(--line); background-color: var(--stone); padding: 0;
                   background-image: url(/models/cast.png); background-size: 800% 100%; }
  .people button:hover { background-color: #fff; }
  .people button.on { border: 2px solid var(--ink); background-color: #fff; }
  .agent select { font: 600 12.5px var(--sans); border-radius: 12px; padding: 8px 10px; flex: 1; }
  .agent textarea.how { font: 13px/1.45 var(--sans); font-style: normal; background: var(--stone); border: 1px solid var(--line); border-radius: 14px;
                        padding: 9px 12px; min-height: 58px; resize: vertical; width: 100%; }
  .agent textarea.how:focus { border-color: var(--butter-deep); }
  .agent .skill { font-size: 13px; color: #55503f; margin: 0; line-height: 1.45; }
  .chip2 { font: 600 11px var(--mono); background: var(--stone); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .add-agent { border: 2px dashed var(--line); border-radius: 22px; background: transparent; color: var(--muted); font: 800 11px var(--sans);
               letter-spacing: .1em; text-transform: uppercase; min-height: 140px; }
  .add-agent:hover { border-color: var(--butter-deep); color: var(--ink); background: #fffdf6; }
  .tm-foot { display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-top: 1px solid var(--line); background: var(--paper); flex-wrap: wrap; }
  .tm-foot .grow { flex: 1; }
  .tm-foot .err { color: var(--bad); font-size: 13px; }
  .linkbtn { border: 0; background: none; color: var(--bad); font: 700 12.5px var(--sans); padding: 8px 4px; }
  .linkbtn:hover { text-decoration: underline; }
  .models { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .models label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .models select { border-radius: 14px; font-size: 12.5px; width: 100%; min-width: 0; text-overflow: ellipsis; }
  @media (max-width: 760px) {
    .tm { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .tm-list { max-height: 168px; border-right: 0; border-bottom: 1px solid var(--line); }
    .agents { grid-template-columns: 1fr; }
    .tm-head, .tm-body, .tm-foot { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 1180px) {
    body { height: auto; }
    main, main.wide { grid-template-columns: 1fr; }
    .office { order: -1; }
    #office3d { flex: none; height: 420px; } /* fixed: the page has no height to share out here */
    .logs { max-height: 420px; order: 1; } /* office, then the brief, then logs */
    .key input { width: 100px; }
  }
  @media (max-width: 560px) {
    header { flex-wrap: wrap; padding: 12px 16px; }
    header .right { margin-left: 0; width: 100%; }
    .key { flex: 1; } .key input { width: 100%; }
    .bar .chip { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <h1>AGORA</h1>
  <span class="ver">v0.2 · Rust · Muse</span>
  <div class="right">
    <button class="pill butter" id="newbrief" type="button">
      <svg class="i" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/></svg>New brief
    </button>
    <button class="pill ghost" id="manage" type="button">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Manage teams
    </button>
    <label class="key" title="Access token, if the hub needs one">
      <svg class="i" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M16 7l3 3M14 9l2 2"/></svg>
      <input id="token" type="password" placeholder="access token" autocomplete="off" aria-label="Access token">
    </label>
  </div>
</header>
<main>
  <section class="panel logs">
    <div class="label">Logs</div>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="chat" class="on">Chat</button>
      <button type="button" data-tab="alibi" title="Errands whose every claim is checked against a ledger">Alibi</button>
      <button type="button" data-tab="activity">Activity</button>
      <button type="button" data-tab="technical" title="Technical">Tech</button>
      <button type="button" data-tab="runs">Runs</button>
    </div>
    <ul class="feed" id="feed"></ul>
    <form class="composer" id="chatform">
      <div class="chips" id="chips"></div>
      <textarea id="chattext" maxlength="1000" placeholder="Message the team. @Name asks one agent, @all starts a discussion." aria-label="Chat message"></textarea>
      <div class="row"><span class="note" id="chatnote"></span><button class="pill butter" id="send" type="submit">Send</button></div>
    </form>
    <form class="composer" id="errandform" hidden>
      <div class="chips" id="errandchips"></div>
      <textarea id="errandtext" maxlength="500" placeholder="Give an errand. The agent works on Asha's contacts, calendar, email, chats and files." aria-label="Errand or question"></textarea>
      <div class="row"><span class="note" id="errandnote"></span>
        <span><button class="pill ghost" id="errandnew" type="button" hidden>New errand</button>
        <button class="pill butter" id="errandgo" type="submit">Run errand</button></span></div>
    </form>
  </section>

  <section class="panel office">
    <div class="bar">
      <span class="team" title="Teammates on this run">
        <svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span id="teamsize">0</span>
      </span>
      <span class="title"><b id="teamname">Agora Office</b><span class="label" id="teamkind">Muse team</span></span>
      <span class="spacer"></span>
      <div class="chip">
        <div><div class="k">Writer</div><div class="v" id="model">…</div></div>
        <span class="sep"></span>
        <div><div class="k">Reviewer</div><div class="v" id="reviewer">…</div></div>
      </div>
    </div>
    <div id="office3d" hidden></div>
    <div class="handle"></div>
    <div class="kanban" id="kanban"></div>
  </section>

  <section class="panel info">
    <div class="info-head"><h2>Project Info</h2><span class="status" id="status">Ready to start</span></div>
    <div class="sect"><span class="label">Team</span></div>
    <div class="team-pick">
      <select id="teamsel" aria-label="Team for the next run"></select>
      <button class="pill ghost" id="editteam" type="button">Edit</button>
    </div>
    <p class="note" id="teamdesc"></p>
    <div class="sect"><span class="label">Models</span></div>
    <div class="models">
      <label><span class="label">Writer</span><select id="modelsel" aria-label="Writer model"></select></label>
      <label><span class="label">Reviewer</span><select id="reviewsel" aria-label="Reviewer model"></select></label>
    </div>
    <p class="note" id="modelnote"></p>
    <div class="sect"><span class="label">User brief</span></div>
    <form id="form">
      <textarea id="brief" maxlength="4000" placeholder="No active brief. Tell the office what to deliver…" required></textarea>
      <div class="row">
        <button class="pill butter" id="go" type="submit">
          <svg class="i" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/></svg>Run office
        </button>
        <span class="note" id="formnote"></span>
      </div>
    </form>
    <div class="sect"><span class="label">Spend</span><span class="tag" id="captag">Cap —</span></div>
    <div class="spend">
      <div class="big" id="spent">$0.0000</div>
      <div class="sub" id="spendsub"><b>0</b> calls · <b>0</b> replayed free</div>
    </div>
    <div class="sect"><span class="label">Deliverable</span></div>
    <pre id="deliverable" class="empty">Appears when the run finishes.</pre>
  </section>
</main>
<dialog id="teams" aria-label="Manage teams"><div class="tm"><nav class="tm-list" id="tmlist"></nav><div class="tm-main" id="tmedit"></div></div></dialog>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// One color per teammate, in plan order; the 3D office uses the same list.
// Butter yellow is the Lead and purple the reviewer, so neither is a teammate color.
const PALETTE = ["#4285f4", "#34a853", "#ea4335", "#14b8a6", "#f97316", "#ec4899", "#64748b", "#a16207"];
window.agoraPalette = PALETTE;
const COLUMNS = [["scheduled", "Scheduled"], ["hold", "On hold"], ["progress", "In progress"], ["done", "Done"]];

let source = null, current = null, tasks = new Map(), tab = "chat", runsCache = [];
const chatLog = []; let typing = null;
let staffed = null; // the team on the run being watched
const named = (t) => (t.owner ? `${t.owner} · ${t.title}` : t.title);
const activity = [], technical = [];
// Every event of the run being watched, so the 3D office can catch up if it loads late.
const runEvents = [];
window.agoraHistory = () => runEvents.slice();

function chatItem(m) {
  const li = el("li", m.kind === "person" ? "mine" : m.kind === "notice" ? "notice" : "");
  const face = el("span", "face"); face.style.background = m.color;
  const bubble = el("div", "bubble");
  bubble.append(el("b", null, m.from), el("span", null, m.text));
  li.append(face, bubble);
  return li;
}
function typingLine() {
  const li = el("li", "typing", typing ? `${typing} is typing…` : "");
  li.id = "typingline"; li.hidden = !typing;
  return li;
}
// One new message (or none, for typing/idle): append it, refresh the typing line,
// and follow the conversation only if the reader was already at the bottom.
function updateChat(message) {
  const feed = $("feed");
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  if (message) {
    feed.querySelector(".empty-note")?.remove();
    if (feed.children.length > 200) feed.firstElementChild.remove();
    feed.insertBefore(chatItem(message), $("typingline"));
  }
  $("typingline").replaceWith(typingLine());
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

function clock() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

function note(text, color) { activity.push({ text, color, t: clock() }); if (tab === "activity") renderFeed(); }

function renderFeed() {
  const feed = $("feed");
  feed.className = "feed" + (tab === "technical" ? " tech" : tab === "chat" ? " chat" : "");
  feed.replaceChildren();
  $("chatform").hidden = tab !== "chat";
  $("errandform").hidden = tab !== "alibi";
  if (tab === "alibi") { feed.className = "feed alibi"; renderAlibi(feed); return; }
  if (tab === "chat") {
    document.querySelector('.tabs [data-tab="chat"]').classList.remove("unread");
    if (!chatLog.length) feed.append(el("li", "empty-note", "Say hello to the team"));
    for (const m of chatLog) feed.append(chatItem(m));
    feed.append(typingLine());
    feed.scrollTop = feed.scrollHeight;
    return;
  }
  if (tab === "runs") {
    if (!runsCache.length) { feed.append(el("li", "empty-note", runsCache.locked ? "Enter the access token to see runs" : "No runs yet")); return; }
    for (const r of runsCache) {
      const li = el("li", "runs-item" + (r.id === current ? " on" : ""));
      const dot = el("span", "dot"); dot.style.background = r.done ? "var(--ok)" : "var(--accent)";
      li.append(dot, el("span", "brief", r.brief), el("span", "t", r.done ? "done" : "live"));
      li.onclick = () => watch(r.id);
      feed.append(li);
    }
    return;
  }
  const items = tab === "activity" ? activity : technical;
  if (!items.length) { feed.append(el("li", "empty-note", tab === "activity" ? "No activity yet" : "No technical data")); return; }
  for (const a of items) {
    const li = el("li");
    if (tab === "activity") {
      const dot = el("span", "dot"); dot.style.background = a.color || "var(--idle)";
      li.append(dot, el("span", null, a.text), el("span", "t", a.t));
    } else li.textContent = a;
    feed.append(li);
  }
  feed.scrollTop = feed.scrollHeight;
}

function column(t) {
  if (t.cls === "accepted") return "done";
  if (t.cls === "failed" || t.cls === "skipped") return "hold";
  if (t.cls === "working" || t.cls === "review") return "progress";
  return "scheduled";
}

function renderBoard() {
  // The run's team, or (with no run open) the team picked for the next one.
  const team = staffed || (current ? null : findTeam(selected));
  $("teamsize").textContent = team ? team.agents.length : tasks.size; // agents, or one per task without a team
  $("teamname").textContent = team ? team.name : "Agora Office";
  $("teamkind").textContent = team ? team.kind || "Team" : "Muse team";
  const box = $("kanban");
  box.replaceChildren();
  for (const [key, name] of COLUMNS) {
    const col = el("div", "col");
    const list = [...tasks.values()].filter((t) => column(t) === key);
    const h = el("h3", "label", name);
    h.append(el("span", "count", String(list.length)));
    const cards = el("div", "cards");
    if (!list.length) cards.append(el("div", "hatch", "EMPTY"));
    for (const t of list) {
      const card = el("div", "card " + t.cls);
      const who = el("div", "who");
      const face = el("span", "face"); face.style.background = t.color;
      who.append(face, el("span", null, t.title));
      card.append(who);
      if (t.owner) card.append(el("div", "owner", t.owner));
      card.append(el("div", "state", t.state));
      if (t.unmet.length) { const ul = el("ul", "unmet"); t.unmet.forEach((u) => ul.append(el("li", null, u))); card.append(ul); }
      cards.append(card);
    }
    col.append(h, cards);
    box.append(col);
  }
}

function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = "status" + (cls ? " " + cls : ""); }

function spend(usd, calls, replayed, secs) {
  $("spent").textContent = "$" + usd.toFixed(4);
  const sub = $("spendsub");
  sub.replaceChildren();
  const b = (v) => el("b", null, String(v));
  if (calls == null) { sub.append("running…"); return; }
  sub.append(b(calls), " calls · ", b(replayed), " replayed free · ", b(secs.toFixed(1) + " s"));
}

function onEvent(e) {
  runEvents.push(e);
  dispatchEvent(new CustomEvent("agora:event", { detail: e })); // the 3D office
  technical.push(JSON.stringify(e.type === "finished" ? { ...e, deliverable: `(${e.deliverable.length} chars)` } : e));
  const t = e.task && tasks.get(e.task);
  if (e.task && !t) { note(`event for an unknown task: ${e.task}`, "var(--bad)"); return; }
  const color = t ? t.color : undefined;
  switch (e.type) {
    case "staffed":
      staffed = e.team;
      $("teamname").textContent = e.team.name; $("teamkind").textContent = e.team.kind || "Team";
      renderChips();
      note(`${e.team.name} is on it: ${e.team.agents.map((a) => a.name).join(", ")}`, "var(--ink)");
      break;
    case "planned":
      tasks = new Map(e.tasks.map((x, i) => {
        const a = staffed?.agents.find((m) => m.id === x.agent);
        return [x.id, { title: x.title, owner: a?.name, color: a?.color || PALETTE[i % PALETTE.length], cls: "",
          state: x.deps.length ? "waiting for " + x.deps.join(", ") : "ready", unmet: [] }];
      }));
      note(`Planned ${e.tasks.length} tasks` + (e.attempts > 1 ? ` (after ${e.attempts} attempts)` : ""), "var(--ink)");
      setStatus("Running", "live");
      break;
    case "task_started": Object.assign(t, { cls: "working", state: "working…" }); note(`${named(t)}: started`, color); break;
    case "drafted":
      Object.assign(t, { cls: "review", state: `draft ${e.draft} (${e.words} words), in review` });
      note(`${named(t)}: draft ${e.draft}, ${e.words} words`, color); spend(e.spent_usd); break;
    case "reviewed":
      t.unmet = e.unmet;
      if (e.unmet.length) Object.assign(t, { cls: "working", state: `draft ${e.draft} sent back (${e.by === "code" ? "code check" : e.by === "vote" ? "3-way vote" : "reviewer"})` });
      note(`${named(t)}: ${e.unmet.length ? "sent back: " + e.unmet.join("; ") : "passed"} [${e.by}]`, e.unmet.length ? "var(--warn)" : "var(--reviewer)");
      spend(e.spent_usd); break;
    case "task_accepted": Object.assign(t, { cls: "accepted", state: `accepted after ${e.drafts} draft${e.drafts > 1 ? "s" : ""}`, unmet: [] }); note(`${named(t)}: accepted`, "var(--ok)"); break;
    case "task_failed": Object.assign(t, { cls: "failed", state: "needs a person: " + e.reason, unmet: [] }); note(`${named(t)}: needs a person`, "var(--bad)"); break;
    case "task_skipped": Object.assign(t, { cls: "skipped", state: "skipped (an input failed)" }); note(`${named(t)}: skipped`, "var(--idle)"); break;
    case "finished": {
      if (source) source.close(); // the stream ends with the run; don't reconnect
      $("deliverable").className = ""; $("deliverable").textContent = e.deliverable || "Nothing was accepted.";
      spend(e.cost_usd, e.calls, e.replayed, e.elapsed_ms / 1000);
      const open = [...tasks.values()].some((x) => x.cls === "failed" || x.cls === "skipped");
      setStatus(open ? "Needs a person" : "Delivered", open ? "bad" : "done");
      note("Finished", "var(--ok)"); refreshRuns(); break;
    }
    case "run_failed":
      if (source) source.close();
      $("deliverable").className = "empty"; $("deliverable").textContent = "The run could not start: " + e.reason;
      setStatus("Failed", "bad"); note("Run failed: " + e.reason, "var(--bad)"); refreshRuns(); break;
  }
  renderBoard();
  if (tab === "technical") renderFeed();
}

function watch(id) {
  if (source) source.close();
  current = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + encodeURIComponent(id));
  if (tab === "runs") renderFeed();
  const run = runsCache.find((r) => r.id === id);
  if (run && !$("brief").value.trim()) $("brief").value = run.brief; // never over a draft
  const token = $("token").value.trim();
  source = new EventSource(`/api/runs/${encodeURIComponent(id)}/events` + (token ? `?token=${encodeURIComponent(token)}` : ""));
  // Every (re)connection replays the whole run, so start from a clean slate.
  source.onopen = () => {
    runEvents.length = 0; activity.length = 0; technical.length = 0;
    dispatchEvent(new Event("agora:reset"));
    tasks = new Map(); staffed = null; setStatus("Planning…", "live"); renderChips();
    $("teamname").textContent = "Agora Office"; $("teamkind").textContent = "Muse team";
    $("deliverable").className = "empty"; $("deliverable").textContent = "Appears when the run finishes.";
    spend(0); renderBoard(); renderFeed();
  };
  source.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (err) { note("bad event: " + err, "var(--bad)"); } };
}

function authHeader() {
  const token = $("token").value.trim();
  return token ? { Authorization: "Bearer " + token } : {};
}

async function refreshRuns() {
  const res = await fetch("/api/runs", { headers: authHeader() });
  if (res.status === 401) runsCache = Object.assign([], { locked: true });
  else if (res.ok) { const runs = await res.json(); runsCache = Array.isArray(runs) ? runs : []; }
  if (tab === "runs") renderFeed();
}

// ---- Models: the office's catalog; the writer and reviewer picks are remembered here ----
let models = [], info = null;
const modelLabel = (id) => models.find((m) => m.id === id)?.label || id;
function modelOptions(select, value, { teamDefault = false, sameAsWriter = false } = {}) {
  select.replaceChildren();
  if (teamDefault) { const o = el("option", null, "Team default (the writer model)"); o.value = ""; select.append(o); }
  if (sameAsWriter) { const o = el("option", null, "Same as writer"); o.value = ""; select.append(o); }
  for (const m of models) {
    const o = el("option", null, m.label + (m.available ? "" : " (needs its API key)"));
    o.value = m.id; o.disabled = !m.available; o.title = m.about;
    select.append(o);

// The same rules the server applies, so a team is fixed here, not rejected later.
function problem(t) {
  const len = (v) => Array.from((v || "").trim()).length;
  if (len(t.name) < 1 || len(t.name) > 40) return "Give the team a name (up to 40 characters).";
  if (len(t.kind) > 40 || len(t.description) > 200) return "Keep the kind under 40 and the description under 200 characters.";
  if (!t.agents.length || t.agents.length > 6) return "A team has 1 to 6 agents.";
  const names = new Set();
  for (const a of t.agents) {
    if (len(a.name) < 1 || len(a.name) > 40 || /[@\u0000-\u001f\u007f]/.test(a.name)) return "Each agent needs a name (up to 40 characters, no @, tabs or line breaks).";
    if (len(a.role) < 1 || len(a.role) > 80) return `Give ${a.name} a role (up to 80 characters).`;
    if (len(a.skills) > 600) return `${a.name}'s skills are over 600 characters.`;
    const key = a.name.trim().toLowerCase();
    if (names.has(key)) return `Two agents are called ${a.name.trim()}.`;
    names.add(key);
  }
  return "";
}

// Ids are made from names: unique, kebab-case, as the server expects.
function normalized(t) {
  const used = new Set();
  const agents = t.agents.map((a, i) => {
    let id = slug(a.name) || `agent-${i + 1}`, n = 2;
    while (used.has(id)) id = `${slug(a.name) || "agent"}-${n++}`;
    used.add(id);
    const out = { id, name: a.name.trim(), role: a.role.trim(), color: a.color, skills: (a.skills || "").trim() };
    if (a.model) out.model = a.model;
    if (a.character) out.character = a.character;
    return out;
  });
  return { id: t.id, name: t.name.trim(), kind: (t.kind || "").trim(), description: (t.description || "").trim(), agents };
}

  found.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  const kept = [];
  for (const r of found) if (!kept.length || r[0] >= kept[kept.length - 1][1]) kept.push(r);
  return kept;
}
function receipt(c, agreed, steps) {
  const box = el("div", "ab-receipt");
  const word = c.verdict === "supported" ? "Backed by the ledger" : agreed === false ? "Disputed: only one checker reads it this way" : "Contradicted by the ledger";
  box.append(el("b", null, word), document.createElement("br"));
  if (c.why) box.append(c.why, document.createElement("br"));
  const seqs = c.seqs || [];
  if (!seqs.length && c.verdict !== "supported") box.append("No ledger entry: this call was never made.");
  for (const n of seqs) {
    const e = steps.get(n);
    if (!e) continue;
    const row = el("div", null, `#${n} ${e.action.tool} · ${e.outcome.subject} → ${e.outcome.ok ? "ok" : "failed"} · ${short(e.hash)}`);
    row.style.cursor = "pointer";
    row.onclick = () => document.getElementById("step-" + n)?.scrollIntoView({ block: "center", behavior: "smooth" });
    box.append(row);
  }
  return box;
}
function saidItem(e, check, steps, agent) {
  const li = el("li", "ab-said");
  const bubble = el("div", "bubble");
  bubble.append(el("b", null, e.turn === 0 ? `${agent} · report` : `${agent} · answer`));
  const body = el("span");
  if (!check) body.textContent = e.message;
  else {
    let at = 0;
    for (const [from, to, i] of ranges(e.message, check.audit.checked)) {
      body.append(e.message.slice(at, from));
      const c = check.audit.checked[i], agreed = check.agreed[i];
      const m = el("mark", claimClass(c, agreed), e.message.slice(from, to));
      const key = `${e.turn}:${i}`;
      m.title = c.verdict === "supported" ? "Backed by the ledger: click for the receipt" : "Click for the receipt";
      m.onclick = () => { errand.open.has(key) ? errand.open.delete(key) : errand.open.add(key); renderFeed(); };
      body.append(m);
      at = to;
    }
    body.append(e.message.slice(at));
  }
  bubble.append(body);
  if (check) check.audit.checked.forEach((c, i) => { if (errand.open.has(`${e.turn}:${i}`)) bubble.append(receipt(c, check.agreed[i], steps)); });
  li.append(bubble);
  return li;
}
function summaryItems(check, steps) {
  const out = [];
  const checked = check.audit.checked;
  const lies = checked.filter((c, i) => c.verdict === "contradicted" && check.agreed[i] !== false).length;
  const disputed = checked.filter((c, i) => c.verdict === "contradicted" && check.agreed[i] === false).length;
  const hidden = [...check.audit.undisclosed_acts, ...check.audit.undisclosed_reads].sort((a, b) => a - b);
  const sum = el("li", "ab-sum");
  if (checked.length) sum.append(el("span", "s-ok", `${checked.length - lies - disputed} backed`));
  if (lies) sum.append(el("span", "s-bad", `${lies} contradicted`));
  if (disputed) sum.append(el("span", "s-dis", `${disputed} disputed`));
  if (hidden.length) sum.append(el("span", "s-hid", `${hidden.length} not mentioned`));
  if (sum.childElementCount) out.push(sum);
  if (hidden.length) {
    const box = el("li");
    const inner = el("div", "ab-hidden");
    inner.append(el("b", null, "Done but not mentioned:"));
    for (const n of hidden) {
      const e = steps.get(n);
      if (e) inner.append(el("div", null, `#${n} ${e.action.tool} · ${e.outcome.subject}${e.outcome.ok ? "" : " (failed)"}`));
    }
    box.append(inner);
    out.push(box);
  }
  const c = check.chain;
  out.push(el("li", "ab-chain" + (c.intact ? "" : " broken"),
    (c.intact ? `Ledger: ${c.entries} entries · hash chain intact · head ${short(c.head)}` : `Ledger tampered: ${c.broken}`)
      + ` · errand cost $${(check.spent_usd ?? 0).toFixed(4)}`));
  return out;
}
function renderAlibi(feed) {
  if (!errand) {
    feed.append(el("li", "empty-note", "Give the agent an errand. Every claim it makes will be checked against the ledger."));
    if (board) feed.append(boardItem(board));
    renderErrandChips();
    return;
  }
  const steps = new Map(), checks = new Map();
  let started = null, busy = null, hiddenNow = new Set();
  for (const e of errand.events) {
    if (e.type === "step") steps.set(e.entry.seq, e.entry);
    if (e.type === "checked") { checks.set(e.turn, e); hiddenNow = new Set([...e.audit.undisclosed_acts, ...e.audit.undisclosed_reads]); }
    if (e.type === "started") started = e;
  }
  const agent = started?.agent || "Agent";
  for (const e of errand.events) {
    if (e.type === "started") {
      const li = el("li", "ab-head");
      li.append(el("b", null, e.brief), el("small", null, `${e.agent} on ${e.model}${e.checker ? ` · second checker ${e.checker}` : ""}`));
      feed.append(li);
    } else if (e.type === "step") feed.append(stepLine(e.entry, hiddenNow.has(e.entry.seq)));
    else if (e.type === "busy") { busy = e; if (e.question) { const q = el("li", "ab-q"); q.append(el("span", null, e.question)); feed.append(q); } }
    else if (e.type === "said") feed.append(saidItem(e, checks.get(e.turn), steps, agent));
    else if (e.type === "checked") for (const li of summaryItems(e, steps)) feed.append(li);
    else if (e.type === "failed") feed.append(el("li", "ab-err", e.reason));
    else if (e.type === "forgotten") feed.append(forgottenItem(e));
    else if (e.type === "idle") busy = null;
  }
  if (busy) {
    const said = errand.events.some((e) => e.type === "said" && e.turn === busy.turn);
    const what = said ? "Checking every claim against the ledger…" : busy.turn === 0 ? `${agent} is working…` : `${agent} is answering…`;
    feed.append(el("li", "ab-busy", what));
  }
  renderErrandChips();
  feed.scrollTop = feed.scrollHeight;
}
const errandIdle = () => errand?.events.filter((e) => e.type === "busy" || e.type === "idle").pop()?.type === "idle";
const hasReport = () => errand?.events.some((e) => e.type === "said" && e.turn === 0);
function renderErrandChips() {
  const box = $("errandchips");
  box.replaceChildren();
  const asking = hasReport();
  $("errandgo").textContent = asking ? "Ask" : "Run errand";
  $("errandnew").hidden = !asking;
  $("errandtext").placeholder = asking ? "Ask about the errand. The answer is checked the same way." : "Give an errand. The agent works on Asha's contacts, calendar, email, chats and files.";
  for (const [label, text] of asking ? QUESTIONS.map((q) => [q, q]) : ERRANDS) {
    const b = el("button", null, label);
    b.type = "button";
    b.onclick = () => { $("errandtext").value = text; if (asking) $("errandform").requestSubmit(); else $("errandtext").focus(); };
    box.append(b);
  }
}
function errandAgent() {
  const a = findTeam(selected)?.agents?.[0];
  return a ? { name: a.name, id: a.id, color: a.color } : { name: "Scout", id: null, color: "#4285f4" };
}
function watchErrand(id, skip = 0) {
  errandSource?.close();
  errand = { id, events: [], open: new Set(), agent: errandAgent(), skip };
  const token = $("token").value.trim();
  errandSource = new EventSource(`/api/errands/${encodeURIComponent(id)}/events` + (token ? `?token=${encodeURIComponent(token)}` : ""));
  errandSource.onopen = () => { errand.events = []; };
  errandSource.onmessage = (m) => {
    let e;
    try { e = JSON.parse(m.data); } catch { return; }
    errand.events.push(e);
    if (errand.skip > 0) errand.skip--; // a replay of what the office already acted out
    else dispatchEvent(new CustomEvent("agora:errand", { detail: { ...e, agentId: errand.agent.id } })); // the 3D office
    // Forgetting rewrites the errand's history on the server: fetch it again.
    // (Once per forgetting: the replay after reconnecting includes the same event.)
    const key = e.type === "forgotten" ? `${errand.id}:${errand.events.length}` : null; // its place in the history
    if (key && !refetched.has(key)) { refetched.add(key); const open = errand.open; watchErrand(errand.id, errand.events.length); errand.open = open; return; }
    if (tab === "alibi") renderFeed();
  };
}
$("errandform").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("errandtext").value.trim();
  if (!text) return;
  const asking = hasReport();
  $("errandgo").disabled = true; $("errandnote").textContent = "";
  try {
    if (asking && !errandIdle()) throw new Error("The agent is still busy.");
    const url = asking ? `/api/errands/${encodeURIComponent(errand.id)}/ask` : "/api/errands";
    const agent = errandAgent();
    const body = asking ? { question: text } : { brief: text, model: $("modelsel").value || undefined, agent: agent.name };
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", ...authHeader() }, body: JSON.stringify(body) });
    const reply = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(reply.error || res.statusText);
    $("errandtext").value = "";
    if (!asking) watchErrand(reply.id);
    if (tab !== "alibi") document.querySelector('.tabs [data-tab="alibi"]').click();
  } catch (err) { $("errandnote").textContent = err.message; }
  finally { $("errandgo").disabled = false; }
};
$("errandnew").onclick = () => { errandSource?.close(); errand = null; renderFeed(); $("errandtext").focus(); };
$("errandtext").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("errandform").requestSubmit(); } };

// Before any run is watched, the office shows the picked team at their desks.
window.agoraIdleTeam = () => (current ? null : findTeam(selected) || null);
const showIdleTeam = () => { if (!current) dispatchEvent(new CustomEvent("agora:team", { detail: findTeam(selected) || null })); };

$("teamsel").onchange = () => { selected = $("teamsel").value; store.set("agora-team", selected); renderTeamPicker(); };
$("manage").onclick = () => openTeams();
$("editteam").onclick = () => openTeams(selected);

renderBoard(); renderFeed(); loadInfo(); loadTeams(); connectChat();
// A link like /#run-123 opens that run (after the list, so its brief shows too).
refreshRuns().finally(() => { if (location.hash.length > 1) watch(decodeURIComponent(location.hash.slice(1))); });
</script>
