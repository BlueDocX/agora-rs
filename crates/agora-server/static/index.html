<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora office</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #0866ff; --ok: #1f8a4c; --warn: #b26a00; --bad: #c0392b; --idle: #9a9aa0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --panel: #1b1c1f; --ink: #ececee; --muted: #9a9aa2; --line: #2c2d31;
            --accent: #4c8dff; --ok: #3fbf76; --warn: #e3a23a; --bad: #ef6b5b; --idle: #6d6d74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header .spend { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; }
  textarea, input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
                    border-radius: 8px; padding: 10px; }
  textarea { min-height: 120px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .note { color: var(--muted); font-size: 13px; min-height: 1.2em; }
  #runs { list-style: none; margin: 0; padding: 0; }
  #runs li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; }
  #runs li:hover, #runs li.on { background: var(--bg); }
  #runs .brief { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .stack > section + section { margin-top: 20px; }
  #office3d { position: relative; margin-bottom: 14px; border-radius: 8px; overflow: hidden; background: var(--bg); }
  #office3d canvas { display: block; touch-action: none; cursor: grab; }
  #office3d button { position: absolute !important; bottom: 10px !important; }
  #tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .task { border: 1px solid var(--line); border-left: 4px solid var(--idle); border-radius: 8px; padding: 10px 12px; }
  .task .title { font-weight: 600; }
  .task .state { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .task .unmet { font-size: 13px; color: var(--warn); margin: 6px 0 0; padding-left: 16px; }
  .task.working { border-left-color: var(--accent); }
  .task.accepted { border-left-color: var(--ok); }
  .task.failed { border-left-color: var(--bad); }
  .task.skipped { border-left-color: var(--idle); opacity: .6; }
  #log { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); max-height: 220px; overflow: auto; margin: 0; white-space: pre-wrap; }
  #deliverable { white-space: pre-wrap; margin: 0; font-size: 15px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Agora</h1><span class="note">a virtual office on Muse</span>
  <span class="spend" id="spend"></span>
</header>
<main>
  <div class="stack">
    <section>
      <h2>New brief</h2>
      <form id="form">
        <textarea id="brief" maxlength="4000" placeholder="What should the office deliver?" required></textarea>
        <input id="token" type="password" placeholder="Access token (if the hub needs one)" autocomplete="off" style="margin-top:8px">
        <div class="row"><button id="go" type="submit">Start</button><span class="note" id="formnote"></span></div>
      </form>
    </section>
    <section>
      <h2>Runs</h2>
      <ul id="runs"><li class="empty">No runs yet.</li></ul>
    </section>
  </div>
  <div class="stack">
    <section>
      <h2>Team</h2>
      <div id="office3d" hidden></div>
      <div id="tasks"><p class="empty">Start a brief or pick a run.</p></div>
    </section>
    <section>
      <h2>Deliverable</h2>
      <pre id="deliverable" class="empty">Appears when the run finishes.</pre>
    </section>
    <section>
      <h2>Activity</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let source = null, current = null, tasks = new Map();
// Every event of the run being watched, so the 3D office can catch up if it loads late.
const runEvents = [];
window.agoraHistory = () => runEvents.slice();

function render() {
  const box = $("tasks");
  box.replaceChildren();
  if (!tasks.size) { box.append(el("p", "empty", "Planning…")); return; }
  for (const t of tasks.values()) {
    const card = el("div", "task " + t.cls);
    card.append(el("div", "title", t.title), el("div", "state", t.state));
    if (t.unmet && t.unmet.length) {
      const ul = el("ul", "unmet");
      t.unmet.forEach((u) => ul.append(el("li", null, u)));
      card.append(ul);
    }
    box.append(card);
  }
}

function log(line) {
  const out = $("log");
  out.textContent += line + "\n";
  out.scrollTop = out.scrollHeight;
}

function onEvent(e) {
  runEvents.push(e);
  dispatchEvent(new CustomEvent("agora:event", { detail: e })); // the 3D office
  const t = e.task && tasks.get(e.task);
  switch (e.type) {
    case "planned":
      tasks = new Map(e.tasks.map((x) => [x.id, { title: x.title, cls: "", state: x.deps.length ? "waiting for " + x.deps.join(", ") : "ready", unmet: [] }]));
      log(`planned ${e.tasks.length} tasks` + (e.attempts > 1 ? ` (after ${e.attempts} attempts)` : ""));
      break;
    case "task_started": Object.assign(t, { cls: "working", state: "working…" }); log(`${e.task}: started`); break;
    case "drafted": Object.assign(t, { state: `draft ${e.draft} (${e.words} words), in review` }); log(`${e.task}: draft ${e.draft}, ${e.words} words`); spend(e.spent_usd); break;
    case "reviewed":
      t.unmet = e.unmet;
      if (e.unmet.length) t.state = `draft ${e.draft} sent back (${e.by === "code" ? "code check" : e.by === "vote" ? "3-way vote" : "reviewer"})`;
      log(`${e.task}: ${e.unmet.length ? "sent back: " + e.unmet.join("; ") : "passed"} [${e.by}]`); spend(e.spent_usd); break;
    case "task_accepted": Object.assign(t, { cls: "accepted", state: `accepted after ${e.drafts} draft${e.drafts > 1 ? "s" : ""}`, unmet: [] }); log(`${e.task}: accepted`); break;
    case "task_failed": Object.assign(t, { cls: "failed", state: "needs a person: " + e.reason, unmet: [] }); log(`${e.task}: needs a person`); break;
    case "task_skipped": Object.assign(t, { cls: "skipped", state: "skipped (an input failed)" }); log(`${e.task}: skipped`); break;
    case "finished":
      if (source) source.close(); // the stream ends with the run; don't reconnect
      $("deliverable").className = ""; $("deliverable").textContent = e.deliverable || "Nothing was accepted.";
      spend(e.cost_usd, `${e.calls} calls${e.replayed ? `, ${e.replayed} replayed` : ""}, ${(e.elapsed_ms / 1000).toFixed(1)} s`);
      log("finished"); refreshRuns(); break;
    case "run_failed":
      if (source) source.close();
      $("deliverable").className = "empty"; $("deliverable").textContent = "The run could not start: " + e.reason;
      log("run failed: " + e.reason); refreshRuns(); break;
  }
  render();
}

function spend(usd, extra) { $("spend").textContent = `$${usd.toFixed(4)}` + (extra ? ` · ${extra}` : ""); }

function watch(id) {
  if (source) source.close();
  current = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + encodeURIComponent(id));
  document.querySelectorAll("#runs li").forEach((li) => li.classList.toggle("on", li.dataset.id === id));
  const token = $("token").value.trim();
  source = new EventSource(`/api/runs/${encodeURIComponent(id)}/events` + (token ? `?token=${encodeURIComponent(token)}` : ""));
  // Every (re)connection replays the whole run, so start from a clean slate.
  source.onopen = () => { runEvents.length = 0; dispatchEvent(new Event("agora:reset")); tasks = new Map(); $("log").textContent = ""; $("deliverable").className = "empty";
                          $("deliverable").textContent = "Appears when the run finishes."; $("spend").textContent = ""; render(); };
  source.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (err) { log("bad event: " + err); } };
}

function authHeader() {
  const token = $("token").value.trim();
  return token ? { Authorization: "Bearer " + token } : {};
}

async function refreshRuns() {
  const res = await fetch("/api/runs", { headers: authHeader() });
  if (res.status === 401) { $("runs").replaceChildren(el("li", "empty", "Enter the access token to see runs.")); return; }
  const runs = await res.json();
  const ul = $("runs");
  ul.replaceChildren();
  if (!runs.length) { ul.append(el("li", "empty", "No runs yet.")); return; }
  for (const r of runs) {
    const li = el("li"); li.dataset.id = r.id;
    li.append(el("span", "brief", r.brief), el("span", "note", r.done ? "done" : "live"));
    li.onclick = () => watch(r.id);
    if (r.id === current) li.classList.add("on");
    ul.append(li);
  }
}

$("token").value = store.get("agora-token");
$("token").onchange = () => { store.set("agora-token", $("token").value.trim()); refreshRuns(); };
$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const token = $("token").value.trim();
  store.set("agora-token", token);
  $("go").disabled = true; $("formnote").textContent = "Starting…";
  try {
    const res = await fetch("/api/runs", { method: "POST",
      headers: { "Content-Type": "application/json", ...authHeader() },
      body: JSON.stringify({ brief: $("brief").value }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    $("formnote").textContent = ""; await refreshRuns(); watch(body.id);
  } catch (err) { $("formnote").textContent = err.message; }
  finally { $("go").disabled = false; }
};
refreshRuns();
// A link like /#run-123 opens that run.
if (location.hash.length > 1) watch(decodeURIComponent(location.hash.slice(1)));
</script>
<script type="module" src="/office.js"></script>
</body>
</html>
